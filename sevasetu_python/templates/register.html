<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — SevaSetu</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header / Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="/" class="brand-logo-link" aria-label="SevaSetu Home">
        <img src="/static/img/logo.svg" alt="SevaSetu Logo" class="brand-logo-img">
      </a>

      <nav class="nav-links" id="main-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/food" class="nav-link">FoodShare</a>
        <a href="/blood" class="nav-link">BloodConnect</a>
        <a href="/funds" class="nav-link">CommunityFunds</a>
        <a href="/about" class="nav-link">About</a>
        <a href="/help" class="nav-link">Help</a>
      </nav>

      <div class="nav-actions">
        <div id="nav-user-area" class="dropdown-wrapper"></div>
        <button type="button" class="icon-btn menu-toggle" id="menu-toggle" aria-label="Toggle Menu">☰</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main">
    <div class="container auth-container">
      <div class="auth-card-wrap">
        <div class="card auth-card">
          <div style="text-align: center; margin-bottom: 1.5rem;">
            <a href="/" class="brand-logo-link" style="justify-content: center; margin-bottom: 0.75rem;">
              <img src="/static/img/logo.svg" alt="SevaSetu Logo" style="height: 48px; width: auto;">
            </a>
            <h2>Join the SevaSetu Community</h2>
            <p class="muted">Connect surplus food, emergency blood, and transparent charity in your city.</p>
          </div>

          <form id="register-form">
            <div class="form-group">
              <label class="label">Full Name *</label>
              <input type="text" id="reg-name" required placeholder="e.g. Aarti Dave" class="input">
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label class="label">Email Address *</label>
                <input type="email" id="reg-email" required placeholder="name@example.com" class="input">
              </div>
              <div class="form-group">
                <label class="label">Mobile Number *</label>
                <input type="tel" id="reg-phone" required placeholder="+91 98250 12345" class="input">
              </div>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label class="label">Your City *</label>
                <select id="reg-city" class="input">
                  <option value="Rajkot">Rajkot</option>
                  <option value="Ahmedabad">Ahmedabad</option>
                  <option value="Surat">Surat</option>
                  <option value="Vadodara">Vadodara</option>
                </select>
              </div>
              <div class="form-group">
                <label class="label">Primary Role *</label>
                <select id="reg-role" class="input">
                  <option value="Volunteer">Volunteer (Food & Logistics)</option>
                  <option value="Food Donor">Food Donor (Restaurant / Banquet)</option>
                  <option value="Blood Donor">Voluntary Blood Donor</option>
                  <option value="NGO Organizer">NGO / Community Organizer</option>
                  <option value="Community Member">Community Member</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="label">Organization / Group (Optional)</label>
              <input type="text" id="reg-org" placeholder="e.g. Youth Seva / Red Cross / Self" class="input">
            </div>

            <div class="form-group">
              <label class="label">Create Password *</label>
              <input type="password" id="reg-password" required placeholder="At least 6 characters" class="input">
            </div>

            <label style="display: flex; gap: 0.5rem; align-items: flex-start; font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; cursor: pointer;">
              <input type="checkbox" required checked style="margin-top: 3px;">
              <span>I agree to community guidelines and voluntary data policy.</span>
            </label>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
              Complete Registration →
            </button>
          </form>

          <div style="text-align: center; margin-top: 1.25rem; font-size: 0.88rem; color: var(--muted);">
            Already have an account? <a href="/login" style="font-weight: 600;">Sign in here</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
